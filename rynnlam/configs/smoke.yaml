# Smoke recipe: 2 optimizer steps of Stage-1 on the bundled synthetic corpus (data/sample_lam/).
#
# Purpose is to prove the whole path runs on a fresh clone -- dataset, model, all five losses,
# checkpointing, eval -- not to learn anything. The corpus is synthetic, so the losses are
# meaningless; only their finiteness matters.
#
# Paths are relative to the current working directory, so run this from the repo root:
#     python scripts/make_sample_lam_data.py
#     python scripts/train_rynnlam.py --config rynnlam/configs/smoke.yaml
# or just:  bash scripts/smoke.sh
#
# Differences from stage1.yaml, all mechanical:
#   - data points at data/sample_lam/ instead of data/processed/
#   - strides fit the 12-frame sample scenes (stage1 uses 5..15)
#   - batch_size 1 / num_workers 0 / max_steps 2 so it finishes in seconds
#   - every loss warmup is 0 so all five loss branches fire inside those 2 steps
#   - encoder_checkpoint_path is null: DA3-Large weights are not redistributed, so the
#     backbone is randomly initialized. Set it to your local DA3-LARGE-1.1
#     model.safetensors to smoke against the real encoder.
data:
  depth_grad_threshold: 0.02
  flow_max_radius: 20.0
  min_frame_stride: 2
  max_frame_stride: 4
  max_sample_stride: 4
  max_scenes: 0
  safetensors_root: ./data/sample_lam
  manifest_path: ./data/sample_lam
  target_hw:
  - 56
  - 56
device: auto
logging:
  eval_interval: 1
  log_interval: 1
  save_interval: 1
  save_interval_steps: 1
  vis_interval: 0
model:
  adversarial_alpha: 2.0
  adversarial_warmup_steps: 0
  cam_dec_hidden_dim: 256
  camera_pose_latent_dim: 32
  embed_dim: 1024
  encoder_backbone: large
  encoder_checkpoint_path: null
  encoder_finetune_mode: freeze
  use_k_token_recon: true
  num_k_tokens: 8
  k_token_source: features
  k_token_bottleneck_dim: 64  # delivered latent: 8 x 64 = 512d
  recon_decoder_model_dim: 512
  recon_decoder_num_heads: 16
  recon_decoder_num_blocks: 4
  flow_decoder_dec_blocks: 8
  flow_decoder_model_dim: 512
  flow_decoder_num_heads: 16
  flow_mask_ratio: 0.5
  latent_dim: 64
  latent_encoder_model_dim: 512
  latent_encoder_num_blocks: 6
  latent_encoder_num_heads: 16
  motion_hint_dim: 128
  motion_hints_dropout: 0.8
  patch_size: 14
  warp_num_sample_points: 8
  latent_encoder_type: selfattn
  flow_decoder_version: v5
resume: null
training:
  batch_size: 1
  contrast_temperature: 0.2
  dataset_sampling_temperature: 2.0
  exp_name: smoke
  flow_loss_beta: 0.05
  flow_warmup_steps: 0
  gradient_accumulation_steps: 1
  target_effective_batch: 0
  lambda_adversarial: 2.0
  lambda_feat: 3.0
  lambda_flow: 5.0
  lambda_pose: 5.0
  lambda_recon: 5.0
  log_z_utilization: true
  lr: 5e-5
  lr_warmup_steps: 0
  max_steps: 2
  use_z_residual_loss: true
  z_recon_warmup_steps: 0
  num_epochs: 1
  num_workers: 0
  use_contrastive_feat_loss: true
output_dir: ./runs/smoke_lam
